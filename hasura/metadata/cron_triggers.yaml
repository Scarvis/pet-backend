- name: cleanup_tokens
  webhook: http://backend:9090/cron/cleanup_tokens
  schedule: 0 3 * * 0
  include_in_metadata: true
  payload: {}
  retry_conf:
    num_retries: 3
    retry_interval_seconds: 10
    timeout_seconds: 60
    tolerance_seconds: 21600
  headers:
    - name: X-Action-Secret
      value_from_env: HASURA_ACTION_SECRET
