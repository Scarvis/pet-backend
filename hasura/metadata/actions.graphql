type Mutation {
  createAccount(
    input: CreateAccountInput!
  ): AccountOutput
}

type Mutation {
  createTrade(
    input: CreateTradeInput!
  ): CreateTradeOutput
}

type Mutation {
  createTransaction(
    input: CreateTransactionInput!
  ): CreateTransactionOutput
}

type Mutation {
  createTransfer(
    input: CreateTransferInput!
  ): CreateTransferOutput
}

type Mutation {
  deleteTransaction(
    input: DeleteTransactionInput!
  ): TransactionMutationOutput
}

type Mutation {
  fetchFxRates(
    input: FetchFxRatesInput!
  ): FetchFxRatesOutput
}

type Mutation {
  login(
    input: LoginInput!
  ): AuthOutput
}

type Mutation {
  rebuildAnalytics(
    input: RebuildAnalyticsInput!
  ): OkOutput
}

type Mutation {
  refreshToken(
    input: RefreshTokenInput!
  ): AuthOutput
}

type Mutation {
  register(
    input: RegisterInput!
  ): AuthOutput
}

type Mutation {
  startImport(
    input: StartImportInput!
  ): StartImportOutput
}

type Mutation {
  updateTransaction(
    input: UpdateTransactionInput!
  ): CreateTransactionOutput
}

enum TransactionKind {
  income
  expense
  transfer
}

enum TradeSide {
  buy
  sell
}

enum ImportFormat {
  csv
  ofx
}

input RegisterInput {
  email: String!
  password: String!
}

input LoginInput {
  email: String!
  password: String!
}

input RefreshTokenInput {
  refresh_token: String!
}

input CreateAccountInput {
  name: String!
  type: String!
  currency: String!
}

input CreateTransactionInput {
  account_id: uuid!
  category_id: uuid
  kind: TransactionKind!
  amount_minor: Bigint!
  currency: String!
  description: String
  occurred_at: timestamptz!
}

input CreateTransferInput {
  from_account_id: uuid!
  to_account_id: uuid!
  amount_minor: Bigint!
  currency: String!
  description: String
  occurred_at: timestamptz!
}

input CreateTradeInput {
  portfolio_id: uuid!
  asset_id: uuid!
  side: TradeSide!
  quantity: numeric!
  price_minor: Bigint!
  executed_at: timestamptz!
}

input StartImportInput {
  account_id: uuid!
  file_base64: String!
  file_name: String!
  file_format: ImportFormat!
}

input UpdateTransactionInput {
  transaction_id: uuid!
  account_id: uuid
  kind: TransactionKind
  amount_minor: Bigint
  currency: String
  occurred_at: timestamptz
}

input DeleteTransactionInput {
  transaction_id: uuid!
}

input FetchFxRatesInput {
  bases: [String!]
  as_of: timestamptz
}

input RebuildAnalyticsInput {
  from: timestamptz
}

type CreateTransactionOutput {
  transaction_id: uuid!
  new_balance_minor: Bigint!
  fx_applied: Boolean!
}

type CreateTradeOutput {
  holding_id: uuid!
  quantity: numeric!
  avg_cost_minor: Bigint!
}

type TransactionMutationOutput {
  transaction_id: uuid!
  new_balance_minor: Bigint!
}

type StartImportOutput {
  job_id: uuid!
  total_rows: Int!
}

type AuthOutput {
  access_token: String!
  refresh_token: String!
  expires_in: Int!
}

type CreateTransferOutput {
  transaction_id: uuid!
  from_balance_minor: Bigint!
  to_balance_minor: Bigint!
  fx_applied: Boolean!
}

type FetchFxRatesOutput {
  rows_written: Int!
}

type OkOutput {
  ok: Boolean!
}

type AccountOutput {
  id: uuid!
  org_id: uuid!
  owner_user_id: uuid!
  name: String!
  type: String!
  currency: String!
  balance_minor: Bigint!
  created_at: timestamptz!
  updated_at: timestamptz!
}

scalar Bigint

