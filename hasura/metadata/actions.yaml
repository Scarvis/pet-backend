custom_types:
  enums:
    - name: TransactionKind
      values:
        - description: null
          is_deprecated: null
          value: income
        - description: null
          is_deprecated: null
          value: expense
        - description: null
          is_deprecated: null
          value: transfer
    - name: TradeSide
      values:
        - description: null
          is_deprecated: null
          value: buy
        - description: null
          is_deprecated: null
          value: sell
    - name: ImportFormat
      values:
        - description: null
          is_deprecated: null
          value: csv
        - description: null
          is_deprecated: null
          value: ofx
  input_objects:
    - name: RegisterInput
    - name: LoginInput
    - name: RefreshTokenInput
    - name: CreateAccountInput
    - name: CreateTransactionInput
    - name: CreateTransferInput
    - name: CreateTradeInput
    - name: StartImportInput
    - name: UpdateTransactionInput
    - name: DeleteTransactionInput
    - name: FetchFxRatesInput
    - name: RebuildAnalyticsInput
  objects:
    - name: CreateTransactionOutput
    - name: CreateTradeOutput
    - name: TransactionMutationOutput
    - name: StartImportOutput
    - name: AuthOutput
    - name: CreateTransferOutput
    - name: FetchFxRatesOutput
    - name: OkOutput
    - name: AccountOutput
  scalars:
    - name: Bigint
