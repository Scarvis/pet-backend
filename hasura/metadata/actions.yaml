actions:
  - name: createAccount
    definition:
      kind: synchronous
      handler: http://backend:9090/actions/account/create
      forward_client_headers: true
      headers:
        - name: X-Action-Secret
          value_from_env: HASURA_ACTION_SECRET
      timeout: 120
    permissions:
      - role: admin
      - role: owner
    comment: Go backend /actions/account/create
  - name: createTrade
    definition:
