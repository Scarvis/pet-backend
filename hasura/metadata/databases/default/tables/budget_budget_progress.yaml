table:
  name: budget_progress
  schema: budget
object_relationships:
  - name: budget_limit
    using:
      foreign_key_constraint_on: budget_limit_id
select_permissions:
  - role: member
    permission:
      columns: '*'
      filter:
        budget_limit:
          budget:
            org_id:
              _eq: X-Hasura-Org-Id
  - role: owner
    permission:
      columns: '*'
      filter:
        budget_limit:
          budget:
            org_id:
              _eq: X-Hasura-Org-Id
  - role: viewer
    permission:
      columns: '*'
      filter:
        budget_limit:
          budget:
            org_id:
              _eq: X-Hasura-Org-Id
