table:
  name: balance_ledger
  schema: account
object_relationships:
  - name: account
    using:
      foreign_key_constraint_on: account_id
select_permissions:
  - role: member
    permission:
      columns: '*'
      filter:
        account:
          org_id:
            _eq: X-Hasura-Org-Id
  - role: owner
    permission:
      columns: '*'
      filter:
        account:
          org_id:
            _eq: X-Hasura-Org-Id
  - role: viewer
    permission:
      columns: '*'
      filter:
        account:
          org_id:
            _eq: X-Hasura-Org-Id
