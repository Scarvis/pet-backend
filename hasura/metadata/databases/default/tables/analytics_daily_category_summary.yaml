table:
  name: daily_category_summary
  schema: analytics
object_relationships:
  - name: category
    using:
      foreign_key_constraint_on: category_id
select_permissions:
  - role: member
    permission:
      columns: '*'
      filter:
        org_id:
          _eq: X-Hasura-Org-Id
  - role: owner
    permission:
      columns: '*'
      filter:
        org_id:
          _eq: X-Hasura-Org-Id
  - role: viewer
    permission:
      columns: '*'
      filter:
        org_id:
          _eq: X-Hasura-Org-Id
