table:
  name: transaction_tags
  schema: tx
object_relationships:
  - name: tag
    using:
      foreign_key_constraint_on: tag_id
  - name: transaction
    using:
      foreign_key_constraint_on: transaction_id
insert_permissions:
  - role: member
    permission:
      check:
        transaction:
          org_id:
            _eq: X-Hasura-Org-Id
      columns:
        - transaction_id
        - tag_id
  - role: owner
    permission:
      check:
        transaction:
          org_id:
            _eq: X-Hasura-Org-Id
      columns:
        - transaction_id
        - tag_id
select_permissions:
  - role: member
    permission:
      columns: '*'
      filter:
        transaction:
          org_id:
            _eq: X-Hasura-Org-Id
  - role: owner
    permission:
      columns: '*'
      filter:
        transaction:
          org_id:
            _eq: X-Hasura-Org-Id
  - role: viewer
    permission:
      columns: '*'
      filter:
        transaction:
          org_id:
            _eq: X-Hasura-Org-Id
update_permissions:
  - role: member
    permission:
      columns:
        - transaction_id
        - tag_id
      filter:
        transaction:
          org_id:
            _eq: X-Hasura-Org-Id
      check: null
  - role: owner
    permission:
      columns:
        - transaction_id
        - tag_id
      filter:
        transaction:
          org_id:
            _eq: X-Hasura-Org-Id
      check: null
delete_permissions:
  - role: member
    permission:
      filter:
        transaction:
          org_id:
            _eq: X-Hasura-Org-Id
  - role: owner
    permission:
      filter:
        transaction:
          org_id:
            _eq: X-Hasura-Org-Id
