table:
  name: user_roles
  schema: identity
object_relationships:
  - name: role
    using:
      foreign_key_constraint_on: role_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: member
    permission:
      columns: '*'
      filter:
        user:
          org_id:
            _eq: X-Hasura-Org-Id
  - role: owner
    permission:
      columns: '*'
      filter:
        user:
          org_id:
            _eq: X-Hasura-Org-Id
  - role: viewer
    permission:
      columns: '*'
      filter:
        user:
          org_id:
            _eq: X-Hasura-Org-Id
