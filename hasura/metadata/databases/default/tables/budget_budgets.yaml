table:
  name: budgets
  schema: budget
array_relationships:
  - name: budget_limits
    using:
      foreign_key_constraint_on:
        column: budget_id
        table:
          name: budget_limits
          schema: budget
insert_permissions:
  - role: owner
    permission:
      check:
        org_id:
          _eq: X-Hasura-Org-Id
      columns:
        - org_id
        - name
        - period
        - starts_on
select_permissions:
  - role: member
    permission:
      columns: '*'
      filter:
        org_id:
          _eq: X-Hasura-Org-Id
  - role: owner
    permission:
      columns: '*'
      filter:
        org_id:
          _eq: X-Hasura-Org-Id
  - role: viewer
    permission:
      columns: '*'
      filter:
        org_id:
          _eq: X-Hasura-Org-Id
update_permissions:
  - role: owner
    permission:
      columns:
        - name
        - period
        - starts_on
      filter:
        org_id:
          _eq: X-Hasura-Org-Id
      check: null
delete_permissions:
  - role: owner
    permission:
      filter:
        org_id:
          _eq: X-Hasura-Org-Id
