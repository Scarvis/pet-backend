table:
  name: portfolios
  schema: invest
array_relationships:
  - name: holdings
    using:
      foreign_key_constraint_on:
        column: portfolio_id
        table:
          name: holdings
          schema: invest
insert_permissions:
  - role: owner
    permission:
      check:
        org_id:
          _eq: X-Hasura-Org-Id
      columns:
        - org_id
        - name
select_permissions:
  - role: member
    permission:
      columns: '*'
      filter:
        org_id:
          _eq: X-Hasura-Org-Id
  - role: owner
    permission:
      columns: '*'
      filter:
        org_id:
          _eq: X-Hasura-Org-Id
  - role: viewer
    permission:
      columns: '*'
      filter:
        org_id:
          _eq: X-Hasura-Org-Id
update_permissions:
  - role: owner
    permission:
      columns:
        - name
      filter:
        org_id:
          _eq: X-Hasura-Org-Id
      check: null
delete_permissions:
  - role: owner
    permission:
      filter:
        org_id:
          _eq: X-Hasura-Org-Id
