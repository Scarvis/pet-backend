table:
  name: trades
  schema: invest
object_relationships:
  - name: holding
    using:
      foreign_key_constraint_on: holding_id
select_permissions:
  - role: member
    permission:
      columns: '*'
      filter:
        holding:
          portfolio:
            org_id:
              _eq: X-Hasura-Org-Id
  - role: owner
    permission:
      columns: '*'
      filter:
        holding:
          portfolio:
            org_id:
              _eq: X-Hasura-Org-Id
  - role: viewer
    permission:
      columns: '*'
      filter:
        holding:
          portfolio:
            org_id:
              _eq: X-Hasura-Org-Id
event_triggers:
  - name: trade_inserted
    definition:
      enable_manual: false
      insert:
        columns: '*'
    retry_conf:
      interval_sec: 15
      num_retries: 3
      timeout_sec: 100
    webhook: http://backend:9090/events/invest/trade
    headers:
      - name: X-Action-Secret
        value_from_env: HASURA_ACTION_SECRET
